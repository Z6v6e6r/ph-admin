name: subscriptions-binding-promotion

on:
  pull_request:
    branches: [main, codex/cup-traffic-quarantine-20260924, codex/r1-reserve-expectations-20261031, codex/r1-tournament-owner-preparation-20261031]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm install --global npm@11.1.0
      - run: npm ci
      - name: Start transaction-capable MongoDB
        run: |
          docker run --detach --name phab-promotion-mongo --publish 127.0.0.1:27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec phab-promotion-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker exec phab-promotion-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec phab-promotion-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 1
          done
      - name: Exact-head identity
        run: |
          test "${GITHUB_REPOSITORY}" = "Z6v6e6r/ph-admin"
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Support contact identity isolation and affected regressions
        run: |
          node --test test/support-contact-identity-ci.test.mjs
          npm run test:support-contact-identity
          npm run test:support-client-resolve
          npm run test:support-dialog-resolution
          npm run test:support-outbox-max-attempts
          npm run test:support-diagnostics
      - name: Support contact identity Mongo process-restart regression
        env:
          SUPPORT_IDENTITY_MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&retryWrites=true&w=majority
        run: npm run test:support-contact-identity:mongo
      - name: Tournament payment fail-closed regressions
        run: |
          node --test test/tournament-payment-ci.test.mjs
          npx ts-node test/tournament-public-payment-binding.test.ts
          npx ts-node test/tournament-public-join-flow.test.ts
          npx ts-node test/tournament-public-payment-attempt-persistence.test.ts
          npx ts-node test/tournament-gender-admission.test.ts
          npx ts-node test/tournaments-custom-energy-checkout.test.ts
          node --test test/tournament-public-pending-reconciliation.test.mjs
          node --test test/tournament-reconciliation-target.test.mjs test/tournament-reconciliation-report.test.mjs
          npx ts-node test/viva-admin-payment-log-redaction.test.ts
          npx ts-node test/viva-admin-custom-energy-checkout.test.ts
          npx ts-node test/viva-admin-tournament-checkout-reuse.test.ts
      - name: Tournament owner preparation identity and read-only regressions
        run: |
          npx ts-node test/tournament-owner-preparation.test.ts
          npx ts-node test/tournament-owner-preparation-readonly.test.ts
          npx ts-node test/request-metrics-subscriptions.test.ts
          npx ts-node test/tournaments-public-registration-identity.test.ts
          npx ts-node test/tournaments-read-model-detail.test.ts
      - name: Tournament owner preparation physical Mongo projection regression
        env:
          TOURNAMENT_OWNER_PREPARATION_MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: npx ts-node test/tournament-owner-preparation.mongodb.test.ts
      - name: Tournament payment physical Mongo persistence regression
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&retryWrites=true&w=majority
        run: npx ts-node test/tournament-public-payment-persistence.mongodb.test.ts
      - name: Tournament reconciliation physical Mongo CAS regression
        env:
          RECONCILIATION_MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&retryWrites=true&w=majority
        run: node --test test/tournament-reconciliation.mongodb.test.mjs
      - name: Binding promotion unit and Mongo transaction tests
        env:
          SUBSCRIPTIONS_PROMOTION_MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: npm run test:subscriptions-binding-promotion
      - run: npm run test:subscriptions-runtime-contracts
      - run: npm run test:subscriptions-indexes
      - run: npm run test:subscriptions-backup
      - run: npm run test:subscriptions-annual-v2
      - run: npm run test:subscriptions-publication
      - run: npm run test:subscriptions-instance-projector
        env:
          SUBSCRIPTIONS_RUNTIME_CONTRACTS_ENABLED: "true"
          SUBSCRIPTIONS_INSTANCE_PROJECTOR_CONTRACTS_ENABLED: "true"
          SUBSCRIPTIONS_INSTANCE_PROJECTOR_MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - run: npm run test:subscriptions-instance-projector-dev-canary
        env:
          SUBSCRIPTIONS_INSTANCE_DEV_CANARY_MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - run: npm run test:subscriptions-sale-readiness
      - run: npm run test:subscriptions-shadow-quote
      - run: npm run test:subscriptions-canonical-target-resolver
      - run: npm run test:subscriptions-synthetic-projection
      - run: npm run test:subscriptions-provider-projection
      - run: npm run test:subscriptions-trusted-shadow-adapter
      - run: npm run test:subscriptions-runtime-context
      - run: npm run test:subscriptions-synthetic-projection:mongo
        env:
          SUBSCRIPTIONS_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - name: Canonical entitlement Mongo concurrency and recovery
        run: npm run test:subscriptions-entitlement-lifecycle:mongo
        env:
          SUBSCRIPTIONS_ENTITLEMENT_MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - run: npm run test:subscriptions-runtime:mongo
        env:
          SUBSCRIPTIONS_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - run: npm run test:backend-release-attestation
      - run: npm run test:subscriptions-dev-release-verifier
      - run: npm run test:subscriptions-dev-host-contract
      - run: npm run test:subscriptions-dev-metrics
      - run: npm run test:subscriptions-dev-mongo-preflight
      - run: npm run test:production-mongo-index-guard
        env:
          PRODUCTION_MONGO_INDEX_GUARD_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - run: npm run test:subscriptions
      - run: npm run test:auth-rbac
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p tsconfig.build.json --noEmit --incremental false
      - run: npm run build
      - name: Deterministic backend artifact and identity attestation
        shell: bash
        run: |
          set -euo pipefail
          artifact_parent="$(mktemp -d)"
          head_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          trusted_ref="HEAD"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            trusted_ref="refs/remotes/origin/main"
          fi
          npm run backend:release-attestation:build -- \
            --source "${GITHUB_WORKSPACE}" \
            --output "${artifact_parent}/first" \
            --expected-head "${head_sha}" \
            --expected-tree "${tree_sha}" \
            --trusted-ref "${trusted_ref}"
          npm run backend:release-attestation:build -- \
            --source "${GITHUB_WORKSPACE}" \
            --output "${artifact_parent}/second" \
            --expected-head "${head_sha}" \
            --expected-tree "${tree_sha}" \
            --trusted-ref "${trusted_ref}"
          cmp "${artifact_parent}/first/ph-admin-backend-${head_sha:0:12}.tar.gz" \
            "${artifact_parent}/second/ph-admin-backend-${head_sha:0:12}.tar.gz"
          cmp "${artifact_parent}/first/release-manifest.json" \
            "${artifact_parent}/second/release-manifest.json"
          for build in dev-first dev-second; do
            npm run backend:release-attestation:build -- \
              --profile subscriptions-dev \
              --source "${GITHUB_WORKSPACE}" \
              --output "${artifact_parent}/${build}" \
              --expected-head "${head_sha}" \
              --expected-tree "${tree_sha}" \
              --trusted-ref "${trusted_ref}"
          done
          cmp "${artifact_parent}/dev-first/ph-admin-subscriptions-dev-${head_sha:0:12}.tar.gz" \
            "${artifact_parent}/dev-second/ph-admin-subscriptions-dev-${head_sha:0:12}.tar.gz"
          cmp "${artifact_parent}/dev-first/release-manifest.json" \
            "${artifact_parent}/dev-second/release-manifest.json"
      - run: git diff --check origin/main...HEAD
