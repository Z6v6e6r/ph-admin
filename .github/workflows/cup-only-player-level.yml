name: CUP-only player level
on:
  pull_request:
    paths:
      - 'src/player-ratings/**'
      - 'src/integrations/viva/**'
      - 'client-sdk/phab-admin-panel.js'
      - 'test/*player*level*'
      - 'test/*player-rating*'
      - 'package.json'
      - '.github/workflows/cup-only-player-level.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:player-ratings
      - run: npx --no-install ts-node test/cup-only-player-level.test.ts
      - run: npm run test:auth-rbac
