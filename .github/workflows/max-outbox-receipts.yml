name: MAX outbox receipts
on:
  pull_request:
    paths: ['src/support/**', 'test/*outbox*', 'package*.json', 'tsconfig*.json', '.github/workflows/max-outbox-receipts.yml']
  push:
    branches: ['codex/max-retry-receipts']
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017/tcp']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:support-outbox-max-attempts
      - run: npm run test:support-max-receipts -- mongodb://127.0.0.1:${{ job.services.mongodb.ports[27017] }}
