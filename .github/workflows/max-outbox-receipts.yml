name: MAX outbox receipts
on:
  pull_request:
    paths: ['src/support/**', 'scripts/lib/cup-legacy-max-snapshot.mjs', 'scripts/lib/cup83-*.mjs', 'test/cup-legacy-max-snapshot.test.mjs', 'test/cup83-*.test.mjs', 'test/cup83-inventory-budget-child.mjs', 'test/*outbox*', 'test/legacy-max-restart-custody.test.ts', 'test/support-web-history-custody.test.ts', 'test/support-cold-reply.test.ts', 'test/support-client-resolve.test.ts', 'test/support-contact-identity-isolation.test.ts', 'test/support-diagnostics.test.ts', 'package*.json', 'tsconfig*.json', '.github/workflows/max-outbox-receipts.yml']
  push:
    branches: ['codex/max-retry-receipts']
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Start isolated Mongo with physical timeout failpoints
        run: |
          docker run --detach --name phab-max-receipts-mongo --publish 127.0.0.1:27017:27017 mongo:7.0 --bind_ip_all --setParameter enableTestCommands=1
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec phab-max-receipts-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
      - run: npm run build
      - name: Offline diagnostic snapshot provenance and compiled importer compatibility
        run: node --test test/cup-legacy-max-snapshot.test.mjs test/cup83-*.test.mjs
      - name: Compatibility defaults and guarded feature UI
        run: |
          npx ts-node test/release-capabilities.test.ts
          npx ts-node test/community-policy-activation.test.ts
          npx ts-node test/max-outbox-provider-refusal.test.ts
          npx ts-node test/support-cold-reply.test.ts
          npx ts-node test/support-client-resolve.test.ts
          npx ts-node test/support-contact-identity-isolation.test.ts
          npx ts-node test/support-diagnostics.test.ts
          npx ts-node test/legacy-max-restart-custody.test.ts
          npx ts-node test/support-web-history-custody.test.ts
          npx ts-node test/support-history-readthrough.test.ts
          npx ts-node test/support-history-readthrough.mongodb.test.ts mongodb://127.0.0.1:27017
          npx ts-node test/support-cold-reply.mongodb.test.ts mongodb://127.0.0.1:27017
          npx ts-node test/messenger-dialog-resolution.test.ts
          npx ts-node test/max-outbox-local-defer.test.ts mongodb://127.0.0.1:27017
          node --test test/location-recommendation-photos-ui.test.mjs test/cup-notification-scenarios.test.mjs test/community-policy-editor.test.mjs
          npx ts-node test/max-outbox-release-compat.mongodb.test.ts mongodb://127.0.0.1:27017
      - run: npm run test:support-outbox-max-attempts
      - run: npm run test:support-max-receipts -- mongodb://127.0.0.1:27017
      - name: Remove owned Mongo fixture
        if: always()
        run: docker rm --force --volumes phab-max-receipts-mongo
