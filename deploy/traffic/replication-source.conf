# Include only in padlhub.su's HTTPS server. The connecting peer is authoritative;
# do not add a real_ip/X-Forwarded-For trust contract to make this endpoint work.
location = /__phab_traffic_policy {
    allow 89.108.64.209;
    deny all;
    limit_except GET { deny all; }
    alias /var/lib/phab-traffic-export/policy.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    etag off;
    open_file_cache off;
    if_modified_since off;
    access_log off;
}
