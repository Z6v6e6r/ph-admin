# http context. Never trust arbitrary X-Forwarded-For.
include /etc/nginx/phab-traffic/policy.conf;
# Include URL-encoded flags accepted by Express/Node-RED, including array forms.
# Ambiguous/duplicate flags selecting a public value are treated conservatively as public.
map $args $phab_public_query {
    default 0;
    ~*(?:^|&)(?:(?:p|%70|%50)(?:u|%75|%55)(?:b|%62|%42)(?:l|%6c|%4c)(?:i|%69|%49)(?:c|%63|%43)|(?:a|%61|%41)(?:v|%76|%56)(?:a|%61|%41)(?:i|%69|%49)(?:l|%6c|%4c)(?:a|%61|%41)(?:b|%62|%42)(?:l|%6c|%4c)(?:e|%65|%45)|(?:f|%66|%46)(?:i|%69|%49)(?:n|%6e|%4e)(?:d|%64|%44))(?:(?:\[|%5b)[^&=]*)?=(?:[^a-z0-9&%]|%[0-9a-f][0-9a-f])*(?:(?:t|%74|%54)(?:r|%72|%52)(?:u|%75|%55)(?:e|%65|%45)|(?:1|%31|%31)|(?:y|%79|%59)(?:e|%65|%45)(?:s|%73|%53)|(?:a|%61|%41)(?:v|%76|%56)(?:a|%61|%41)(?:i|%69|%49)(?:l|%6c|%4c)(?:a|%61|%41)(?:b|%62|%42)(?:l|%6c|%4c)(?:e|%65|%45)|(?:f|%66|%46)(?:i|%69|%49)(?:n|%6e|%4e)(?:d|%64|%44))(?:[^a-z0-9&%]|%[0-9a-f][0-9a-f])*(?:&|$) 1;
}
map "$request_method|$uri|$phab_public_query" $phab_public_read {
    default 0;
    ~*^(GET|HEAD)\|/lk/games(?:/by-phone)?/?\|1$ 1;
    ~*^(GET|HEAD)\|/lk/tournaments/?\| 1;
    ~*^(GET|HEAD)\|/lk/tournaments/americano/history/?\| 1;
    ~*^(GET|HEAD)\|/lk/tournaments/participants/?\| 1;
    ~*^(GET|HEAD)\|/lk/games/[^/]+/participants/?\| 1;
}
map "$phab_quarantined:$phab_public_read" $phab_traffic_drop {
    default 0;
    "1:1" 1;
}
map $uri $phab_traffic_route {
    default other;
    ~^/lk/games(?:/by-phone)?/?$ schedule;
    ~^/lk/tournaments/americano/history/?$ history;
    ~^/lk/tournaments/?$ tournaments;
    ~^/lk/games/[^/]+/participants/?$ participants;
    ~^/lk/tournaments/participants/?$ participants;
}
map $request_method $phab_traffic_method {
    default OTHER;
    GET GET; HEAD HEAD; OPTIONS OPTIONS; POST POST; PUT PUT;
    PATCH PATCH; DELETE DELETE; CONNECT CONNECT; TRACE TRACE;
}
log_format phab_traffic escape=json '{"id":"$request_id","ts":"$time_iso8601","ip":"$remote_addr","method":"$phab_traffic_method","route":"$phab_traffic_route","status":$status,"bytes":$body_bytes_sent,"blocked":$phab_traffic_drop}';
# Local readback proves the new worker generation has loaded the desired policy.
server {
    listen 127.0.0.1:18147;
    access_log off;
    location = /traffic-policy { return 200 "$phab_traffic_policy_digest"; }
    location / { return 404; }
}
