# Relevant public server context. "if + return" has no rewrite/upstream side effects.
if ($phab_traffic_drop) { return 444; }
# Include this access_log ALSO in every location that overrides/inhibits server access logs.
# Keep existing logs; this separate, sanitized stream must contain each request exactly once.
access_log /var/log/nginx/phab-traffic.jsonl phab_traffic buffer=64k flush=5s;
