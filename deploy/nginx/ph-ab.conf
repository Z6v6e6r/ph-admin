server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://phab-api:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # Permanent QR links: /q/<code> is proxied to the backend /api/q/<code>.
  location = /q {
    return 404;
  }

  location ^~ /q/ {
    proxy_pass http://phab-api:3000/api/q/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }

  location = /admin {
    return 302 /api/ui/admin/login;
  }

  location = /admin/qr {
    return 302 /api/ui/admin?section=qr-links;
  }

  # nginx requires the regex to be quoted because of the {8,64} quantifier.
  location ~ "^/admin/qr/([0-9a-fA-F-]{8,64})$" {
    return 302 /api/ui/admin?section=qr-links&qrId=$1;
  }

  location = / {
    return 302 /api/ui/admin;
  }
}
