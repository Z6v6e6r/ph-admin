# Permanent QR links for the CUP «QR-коды» section.
# Add these blocks inside the existing HTTPS server { listen 443 ssl; ... }
# next to the audited /api/ location. Do not apply automatically.
#
# 1) Public short links: https://padlhub.su/q/<code> -> backend /api/q/<code>
#    The backend sends 302/404/410/503 and Cache-Control: no-store itself.
#    Proxy caching is explicitly disabled; never place /q/ behind a CDN cache.
location = /q {
    return 404;
}

location ^~ /q/ {
    proxy_pass http://127.0.0.1:3000/api/q/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    # Optional: enable together with nginx-qr-links-rate-limit-http.conf.
    # limit_req zone=qr_public burst=20 nodelay;
}

# 2) Deep links into the existing CUP administration SPA.
#    /admin/qr and /admin/qr/:id are aliases for the QR tab of /api/ui/admin.
location = /admin/qr {
    return 302 /api/ui/admin?section=qr-links;
}

# nginx requires the regex to be quoted because of the {8,64} quantifier.
location ~ "^/admin/qr/([0-9a-fA-F-]{8,64})$" {
    return 302 /api/ui/admin?section=qr-links&qrId=$1;
}
