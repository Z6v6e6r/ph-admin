# BEGIN PHAB MANAGED PUBLIC TOURNAMENT ROUTES
location ^~ /api/tournaments/public/ {
    rewrite ^/api/tournaments/public/(?!list$|showcase$)([^/?#]+)$ https://padlhub.ru/tournaments?slug=$1 permanent;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 65s;

    add_header Access-Control-Allow-Origin "https://padlhub.ru" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, Range, X-PadlHub-Auth-Source, X-PadlHub-Tenant-Key" always;
}
# END PHAB MANAGED PUBLIC TOURNAMENT ROUTES
