# Optional edge rate limit for permanent QR links.
# Include this file inside the http { ... } block of the nginx config
# (outside server blocks), then uncomment the limit_req line in
# nginx-qr-links-location.conf. Do not apply automatically.
#
# 60 requests per minute per client IP with a short burst is enough for
# printed QR codes (a scan is one request) and limits stat stuffing and
# arbitrary open-redirect probing. Tune only through an approved change.
limit_req_zone $binary_remote_addr zone=qr_public:10m rate=60r/m;
limit_req_status 429;
