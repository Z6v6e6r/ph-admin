# Mobile resident check screen (CUP staff) - optional pretty alias.
#
# The canonical route lives in the existing Nest router:
#   /api/ui/admin/residency/check?stationId=<stationId>
#
# The short QR destination keeps the short-lived pass token in the URL FRAGMENT:
#   https://padlhub.su/admin/residency/check#pass=<passToken>
#
# A fragment is never sent to the server, so the token cannot reach an nginx
# access log, "User-Agent"-style request logs, proxy caches or the 302 below.
# The browser preserves the fragment across this redirect, and the served
# client script clears it with history.replaceState after reading it.
#
# Deliberately NO $is_args$args here: forwarding query arguments would let a
# legacy/again-injected "?pass=..." value be written to the access log. Only the
# canonical /api route may carry the non-secret stationId deep-link.
#
# Add the block inside the existing HTTPS server { listen 443 ssl; ... }
# next to the audited /api/ location. Do not apply automatically: routing is a
# separately approved deployment action. Check with:
#   sudo nginx -t && curl -I 'https://padlhub.su/admin/residency/check'
location = /admin/residency/check {
    return 302 /api/ui/admin/residency/check;
}
