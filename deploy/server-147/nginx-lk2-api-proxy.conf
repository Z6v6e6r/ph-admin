# Same-origin proxy from padlhub.su to the LK2 beta contour.
#
# The ЦУП panel is served from https://padlhub.su and reuses that origin for the PadlHub APIs, so the
# operator browser never depends on CORS or on direct reachability of the beta host. The panel keeps
# relative media URLs (/public/api/v1/<tenant>/location-media/<assetId>) in station profiles, which
# means all three locations below are required:
#   /admin/api/v1/  - notification and station admin commands;
#   /user/api/v1/   - PadlHub auth/session calls;
#   /public/api/v1/ - public media delivery: station gallery, gallery cover and recommendation photos.
# Without /public/api/v1/ every uploaded photo is stored (READY, image/webp) and renders in LK, but the
# console requests it on padlhub.su and receives 404, so the gallery and card thumbnails stay broken.
location ^~ /admin/api/v1/ {
    proxy_pass https://lk2.padlhub.su;
    proxy_ssl_server_name on;
    proxy_set_header Host lk2.padlhub.su;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ^~ /user/api/v1/ {
    proxy_pass https://lk2.padlhub.su;
    proxy_ssl_server_name on;
    proxy_set_header Host lk2.padlhub.su;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ^~ /public/api/v1/ {
    proxy_pass https://lk2.padlhub.su;
    proxy_ssl_server_name on;
    proxy_set_header Host lk2.padlhub.su;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
