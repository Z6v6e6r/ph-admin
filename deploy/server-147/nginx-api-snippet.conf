# Add these blocks inside server { listen 443 ssl; ... }

location = /api {
    return 301 /api/;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # Station photos, gallery covers and event-showcase images are uploaded through the console API.
    # Nginx defaults to 1m and answers 413 text/html before the request reaches the console, which the
    # panel could only show as "PadlHub Admin API: HTTP 413". 20m matches the console container and
    # REQUEST_BODY_LIMIT and stays above the 12 MiB bridge cap for station media; it applies to the
    # whole /api/ prefix, exactly like deploy/nginx/ph-ab.conf.
    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
}

location ^~ /lk/advertising/ {
    proxy_pass http://127.0.0.1:3000/api/advertising/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
}

location = /admin {
    return 302 /api/ui/admin/login;
}
